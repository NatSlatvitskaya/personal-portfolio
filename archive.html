<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-title="archive.meta.title">Архив — Наталья Слатвицкая</title>
<meta name="description" content="Сквозной архив проектов: брендинг, иллюстрация, вэб-дизайн.">
<meta name="theme-color" content="#B98FEB">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/tune.css?v=2.1">
</head>
<body class="is-scroll-body">

<div class="fx" aria-hidden="true">
  <div class="fx__grad"></div>
  <div class="fx__edge"></div>
  <div class="fx__grain"></div>
</div>

<div class="page">

  <header class="topbar page__bar">
    <div class="topbar__left">
      <a class="topbar__link" href="index.html" data-i18n="archive.back">На главную</a>
    </div>
    <div class="topbar__right">
      <a class="topbar__exp" href="about.html" data-i18n="top.exp">6 лет опыта</a>
    </div>
  </header>

  <main class="page__main">
    <h1 class="page__title" data-i18n="archive.title">Все проекты</h1>

    <div class="filters" role="group">
      <button class="filter tag is-active" type="button" data-filter="all" aria-pressed="true">
        <span data-i18n="archive.all">Все</span><span class="filter__count"></span>
      </button>
      <button class="filter tag" type="button" data-filter="branding" aria-pressed="false">
        <span data-i18n="archive.branding">Брендинг</span><span class="filter__count"></span>
      </button>
      <button class="filter tag" type="button" data-filter="illustration" aria-pressed="false">
        <span data-i18n="archive.illustration">Иллюстрация</span><span class="filter__count"></span>
      </button>
      <button class="filter tag" type="button" data-filter="web" aria-pressed="false">
        <span data-i18n="archive.web">Веб-дизайн</span><span class="filter__count"></span>
      </button>
      <div class="socials filters__social">
        <a class="social" href="#" data-contact="cv" target="_blank" rel="noopener"
           data-i18n-attr="aria-label:foot.cv" aria-label="CV">
          <span class="pixel">CV</span>
          <span class="social__tip" data-i18n="foot.cv">CV</span>
        </a>
        <a class="social" href="#" data-contact="dprofile" target="_blank" rel="noopener"
           data-i18n-attr="aria-label:foot.dprofile" aria-label="Dprofile">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2"/></svg>
          <span class="social__tip" data-i18n="foot.dprofile">Dprofile</span>
        </a>
        <a class="social" href="#" data-contact="behance" target="_blank" rel="noopener"
           data-i18n-attr="aria-label:foot.behance" aria-label="Behance">
          <span class="pixel" style="font-size:0.92em">Be</span>
          <span class="social__tip" data-i18n="foot.behance">Behance</span>
        </a>
        <a class="social" href="#" data-contact="telegram" target="_blank" rel="noopener"
           data-i18n-attr="aria-label:foot.telegram" aria-label="Telegram">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 4L2.5 11.2l5.1 1.7L19 6.4 9.4 14.2l-.4 4.6 3-3.2 4.2 3.1L21 4Z" fill="currentColor"/></svg>
          <span class="social__tip" data-i18n="foot.telegram">Telegram</span>
        </a>
        <a class="social" href="#" data-contact="email"
           data-i18n-attr="aria-label:foot.email" aria-label="E-mail">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="1.8" stroke="currentColor" stroke-width="1.9"/><path d="M3.5 6.8L12 12.6l8.5-5.8" stroke="currentColor" stroke-width="1.9"/></svg>
          <span class="social__tip" data-i18n="foot.email">E-mail</span>
        </a>
      </div>
    </div>

    <div class="grid-archive" id="archiveGrid" aria-live="polite"></div>
  </main>

  <footer class="arch-foot">
    <span data-i18n="foot.rights">© 2026 Наталья Слатвицкая</span>
    <span data-i18n="foot.built">Собрано вручную · HTML / CSS / JS</span>
    <button class="arch-foot__console" type="button" data-open-terminal data-i18n="foot.console">v1.2 / console</button>
  </footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalTitle">
  <div class="modal__scrim" id="modalScrim"></div>
  <div class="modal__window">
    <div class="modal__bar">
      <img class="modal__bar-logo" src="assets/img/logo-nat.png" alt="" aria-hidden="true">
      <span class="modal__bar-title" id="modalBarTitle">case.case</span>
      <span class="modal__bar-actions">
        <button class="wbtn wbtn--close" type="button" data-close-modal aria-label="Закрыть"
                data-i18n-attr="aria-label:modal.close">×</button>
      </span>
    </div>
    <div class="modal__scroll" id="modalScroll"><div id="modalBody"></div></div>
  </div>
</div>

<div class="terminal" id="terminal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Терминал">
  <div class="terminal__box">
    <div class="terminal__bar">
      <span data-i18n="term.title">nnz://terminal</span>
      <button class="wbtn wbtn--close" type="button" id="termClose" aria-label="Закрыть" style="margin-left:auto">×</button>
    </div>
    <div class="terminal__out" id="termOut"></div>
    <div class="terminal__in">
      <span class="terminal__prompt">nnz:~$</span>
      <input class="terminal__field" id="termField" type="text" autocomplete="off" spellcheck="false" aria-label="Команда">
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
