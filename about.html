<script>
(function pixelFigure() {
  const root = document.getElementById('pxFig');
  if (!root) return;

  const HOLD = 4000;
  const PHOTO = 'assets/img/about/photo.png';
  const STATES = [
    {
      id: 'photo', num: '01', count: [0, 2], photo: true,
      rows: ['..##.#..', '#####.#.', '.#####..', '#.###...'],
      texts: [
        [0, 0, 2, 'Привет, Я — Наташа, мультидисциплинарный дизайнер', "Hi, I'm Natasha, a multidisciplinary designer"],
        [5, 1, 1, '6 лет опыта', '6 years of experience'],
        [5, 3, 2, 'Помогаю брендам и продуктам ломать шаблоны и запоминаться', 'I help brands and products break templates and stand out']
      ]
    },
    {
      id: 'focus', num: '02', count: [5, 2],
      rows: ['#..##.#.', '.######.', '#####.#.', '##...#..'],
      texts: [
        [1, 0, 2, 'Мультидисциплинарный дизайнер', 'Multidisciplinary designer'],
        [5, 0, 1, '6 лет опыта', '6 years of experience'],
        [2, 3, 2, 'Проектирую визуальные системы: от айдентики и гайдлайнов до иллюстраций и веб-интерфейсов', 'I design visual systems, from identity and guidelines to illustrations and web interfaces']
      ]
    },
    {
      id: 'dims', num: '03', count: [0, 0],
      rows: ['.##..#..', '#######.', '#####.##', '#...###.'],
      texts: [
        [3, 0, 2, 'Системный подход к бренду', 'A systematic approach to brand'],
        [1, 3, 2, 'Работаю в четырёх измерениях бренда — даю продукту пользу, голос, характер и смысл', 'I work across four dimensions of a brand, giving the product utility, voice, character and meaning']
      ]
    },
    {
      id: 'meaning', num: '04', count: [6, 1],
      rows: ['#...#.#.', '######..', '########', '.##.###.'],
      texts: [
        [1, 0, 3, 'Соединяю системную логику с живой графикой, превращая смыслы в дизайн, который считывается с первого взгляда', 'Blending systemic logic with living graphics, turning meanings into design that reads at first glance'],
        [3, 3, 1.3, 'Дизайн, который звучит громко', 'Design that speaks loudly']
      ]
    }
  ];

  const mq = window.matchMedia('(max-width: 860px)');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  let layers = [];
  let current = 0;

  function place(c, r) {
    return mq.matches ? [r, c] : [c, r];
  }

  function setPos(node, c, r) {
    const [x, y] = place(c, r);
    node.style.setProperty('--c', x);
    node.style.setProperty('--r', y);
  }

  function make(tag, cls) {
    const n = document.createElement(tag);
    n.className = cls;
    return n;
  }

  function show(i) {
    layers.forEach((layer, k) => layer.classList.toggle('is-on', k === i));
  }

  function build() {
    root.style.setProperty('--cols', mq.matches ? 4 : 8);
    root.style.setProperty('--rows', mq.matches ? 8 : 4);
    root.replaceChildren();
    layers = STATES.map((st) => {
      const layer = make('div', 'pxfig__layer');
      layer.dataset.state = st.id;
      st.rows.forEach((row, r) => [...row].forEach((ch, c) => {
        if (ch !== '#') return;
        const cell = make('div', 'pxfig__cell');
        setPos(cell, c, r);
        if (st.photo) {
          const img = make('img', 'pxfig__img');
          img.src = PHOTO;
          img.alt = '';
          cell.append(img);
        }
        layer.append(cell);
      }));
      st.texts.forEach(([c, r, w, ru, en]) => {
        const t = make('p', 'pxfig__text');
        setPos(t, c, r);
        t.style.setProperty('--w', mq.matches ? 2 : w);
        const a = make('span', 't-ru');
        a.textContent = ru;
        const b = make('span', 't-en');
        b.textContent = en;
        t.append(a, b);
        layer.append(t);
      });
      const k = make('p', 'pxfig__count');
      setPos(k, st.count[0], st.count[1]);
      const n = document.createElement('span');
      n.textContent = st.num + ' ';
      const d = document.createElement('i');
      d.textContent = '/ 04';
      k.append(n, d);
      layer.append(k);
      root.append(layer);
      return layer;
    });
    show(current);
  }

  function tick() {
    setTimeout(() => {
      current = (current + 1) % STATES.length;
      show(current);
      tick();
    }, HOLD);
  }

  build();
  if (!reduce.matches) tick();
  mq.addEventListener('change', build);
})();
</script>
