<script>
(function pixelFigure() {
  const COLS = 8;
  const ROWS = 4;
  const POOL = 24;
  const HOLD = 5000;
  const CASCADE = 100;
  const CENTER_C = (COLS - 1) / 2;
  const CENTER_R = (ROWS - 1) / 2;

  const root = document.getElementById('pxFig');
  if (!root) return;
  const stage = root.querySelector('.pxf__stage');

  const fig = (rows, fill) => rows.flatMap((line, r) =>
    [...line].flatMap((ch, c) => (ch === '■' ? [[c, r, fill]] : [])));
  const T = (c, r, w, h, kind, tone, ru, en, center) => ({ c, r, w, h, kind, tone, ru, en, center: !!center });

  const states = [
    {
      id: 'intro', num: '01',
      cells: fig([
        '··■■·■■·',
        '■■■■■■·■',
        '·■■■■■■·',
        '■·■■■■··',
      ], 'photo'),
      texts: [
        T(0, 0, 2, 1, 'body', 'light', 'Привет, я — Наташа, мультидисциплинарный дизайнер', 'Hi, I’m Natasha, a multidisciplinary designer'),
        T(6, 1, 1, 1, 'body', 'light', '6 лет опыта', '6 years of experience', true),
        T(0, 2, 1, 1, 'count', 'soft', '01 / 04', '01 / 04'),
        T(6, 3, 2, 1, 'body', 'light', 'Помогаю брендам\nи продуктам ломать\nшаблоны и запоминаться', 'I help brands and products break templates and be remembered'),
      ],
    },
    {
      id: 'focus', num: '02',
      cells: fig([
        '■··■■·■■',
        '■■■■■■·■',
        '■■■■■■■■',
        '■■■···■·',
      ], 'purple'),
      texts: [
        T(1, 0, 2, 1, 'body', 'light', 'Мультидисциплинарный дизайнер', 'Multidisciplinary designer'),
        T(5, 0, 1, 1, 'body', 'light', '6 лет опыта', '6 years of experience'),
        T(1, 1, 5, 2, 'title', 'dark', 'Фокус', 'Focus'),
        T(6, 1, 1, 1, 'count', 'soft', '02 / 04', '02 / 04'),
        T(3, 3, 3, 1, 'body', 'light', 'Проектирую визуальные\nсистемы: от айдентики\nи гайдлайнов до иллюстраций\nи веб-интерфейсов', 'I design visual systems: from identity and guidelines to illustrations and web interfaces'),
      ],
    },
    {
      id: 'dimensions', num: '03',
      cells: fig([
        '■■····■·',
        '■■■■■■■■',
        '■■■■·■■■',
        '■···■■■■',
      ], 'dark'),
      texts: [
        T(2, 0, 4, 1, 'body', 'light', 'Системный подход к бренду', 'Systemic approach to the brand'),
        T(7, 0, 1, 1, 'count', 'soft', '03 / 04', '03 / 04'),
        T(1, 1, 7, 2, 'title', 'light', '4 измерения', '4 dimensions'),
        T(1, 3, 3, 1, 'body', 'light', 'Работаю в четырёх измерениях\nбренда — даю продукту пользу,\nголос, характер и смысл', 'I work across four dimensions of a brand — giving the product utility, voice, character and meaning'),
      ],
    },
    {
      id: 'meaning', num: '04',
      cells: fig([
        '·■···■·■',
        '·■■■■■■·',
        '■■■■■■■■',
        '··■··■■·',
      ], 'green'),
      texts: [
        T(2, 0, 3, 1, 'body', 'light', 'Соединяю системную логику с живой графикой, превращая смыслы в дизайн, который считывается с первого взгляда', 'I connect systemic logic with living graphics, turning meanings into design that reads at first glance'),
        T(7, 1, 1, 1, 'count', 'soft', '04 / 04', '04 / 04'),
        T(1, 2, 7, 1, 'title', 'dark', 'Смысл и форма', 'Meaning & form'),
        T(3, 3, 2, 1, 'body', 'light', 'Дизайн, который звучит громко', 'Design that speaks loudly'),
      ],
    },
  ];

  const tiles = [];
  for (let i = 0; i < POOL; i++) {
    const el = document.createElement('span');
    el.className = 'pxf__px';
    const photo = document.createElement('span');
    photo.className = 'tile-photo';
    const clip = document.createElement('div');
    clip.className = 'tile-title-clip';
    const p = document.createElement('p');
    const ru = document.createElement('span');
    ru.className = 't-ru';
    const en = document.createElement('span');
    en.className = 't-en';
    p.append(ru, en);
    clip.append(p);
    el.append(photo, clip);
    stage.append(el);
    tiles.push({ el, clip, ru, en, c: CENTER_C, r: CENTER_R, s: 0.2, fill: 'dark' });
  }

  const texts = [];
  states.forEach((st, si) => {
    st.texts.forEach((t) => {
      if (t.kind === 'title') {
        st.title = t;
        return;
      }
      const el = document.createElement('div');
      el.className = `pxf__tx pxf__tx--${t.kind} tone-${t.tone}${t.center ? ' is-center' : ''}`;
      el.style.setProperty('--c', t.c);
      el.style.setProperty('--r', t.r);
      el.style.setProperty('--w', t.w);
      el.style.setProperty('--h', t.h);
      const p = document.createElement('p');
      const ru = document.createElement('span');
      ru.className = 't-ru';
      const en = document.createElement('span');
      en.className = 't-en';
      if (t.kind === 'count') {
        const fmt = (s) => s.replace(/^(\d\d \/)/, '<span class="pxf__cur">$1</span>');
        ru.innerHTML = fmt(t.ru);
        en.innerHTML = fmt(t.en);
      } else {
        ru.textContent = t.ru;
        en.textContent = t.en;
      }
      p.append(ru, en);
      el.append(p);
      stage.append(el);
      texts.push({ el, si });
    });
  });

  let cell = 1;
  function size() {
    const cs = getComputedStyle(root);
    const w = root.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = root.clientHeight;
    const gap = Math.min(48, Math.max(12, h * 0.06));
    cell = Math.max(8, Math.floor(Math.min(w / COLS, (h - 2 * gap) / ROWS)));
    root.style.setProperty('--cell', `${cell}px`);
  }

  function assign(cells) {
    const free = tiles.slice();
    const targets = new Map();
    cells.forEach(([c, r, fill]) => {
      let best = null;
      let cost = Infinity;
      free.forEach((t) => {
        const d = Math.abs(t.c - c) + Math.abs(t.r - r) + (t.fill === fill ? 0 : 2);
        if (d < cost) { cost = d; best = t; }
      });
      free.splice(free.indexOf(best), 1);
      targets.set(best, { c, r, fill, on: true });
    });
    const hubC = cells.reduce((s, [c]) => s + c, 0) / cells.length;
    const hubR = cells.reduce((s, [, r]) => s + r, 0) / cells.length;
    free.forEach((t) => targets.set(t, { c: hubC, r: hubR, fill: t.fill, on: false }));
    return targets;
  }

  const distFromCenter = (g) => Math.hypot(g.c - CENTER_C, g.r - CENTER_R);

  function show(i) {
    const st = states[i];
    root.dataset.state = st.id;
    const plan = assign(st.cells);
    [...plan.entries()]
      .sort((a, b) => distFromCenter(a[1]) - distFromCenter(b[1]))
      .forEach(([t, g], k) => {
        const from = { c: t.c, r: t.r, s: t.s };
        const to = { c: g.c, r: g.r, s: g.on ? 1 : 0.2 };
        t.c = g.c;
        t.r = g.r;
        t.s = to.s;
        t.fill = g.fill;
        t.el.style.setProperty('--c', g.c);
        t.el.style.setProperty('--r', g.r);
        if (g.on && st.id === 'intro') {
          t.el.style.setProperty('--bx', g.c);
          t.el.style.setProperty('--by', g.r);
        }
        t.el.style.setProperty('--s', to.s);
        const delay = Math.round((k * CASCADE) / (POOL - 1));
        t.el.style.setProperty('--d', `${delay}ms`);
        animateClip(t, from, to, delay);
        t.el.classList.toggle('is-on', g.on);
        t.el.classList.toggle('show-photo', g.on && st.id === 'intro');
        t.el.dataset.fill = g.fill;
        const title = g.on ? st.title : null;
        t.clip.className = title ? `tile-title-clip tone-${title.tone}` : 'tile-title-clip';
        t.ru.textContent = title ? title.ru : '';
        t.en.textContent = title ? title.en : '';
      });
    texts.forEach(({ el, si }) => el.classList.toggle('is-on', si === i));
  }

  const bezier = (x1, y1, x2, y2) => (x) => {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    let lo = 0, hi = 1, u = x;
    for (let i = 0; i < 40; i++) {
      const xu = ((ax * u + bx) * u + cx) * u;
      if (Math.abs(xu - x) < 1e-6) break;
      if (xu < x) lo = u; else hi = u;
      u = (lo + hi) / 2;
    }
    return ((ay * u + by) * u + cy) * u;
  };
  const EASE = bezier(0.65, 0, 0.35, 1);
  const FRAMES = 48;

  const clipOf = (c, r, s) => {
    const ox = c + (1 - s) / 2;
    const oy = r + (1 - s) / 2;
    return { tx: (COLS / 2 - ox) / s - COLS / 2, ty: (ROWS / 2 - oy) / s - ROWS / 2, k: 1 / s };
  };

  const animateClip = (t, from, to, delay) => {
    const end = clipOf(to.c, to.r, to.s);
    t.clip.style.setProperty('--tx', end.tx.toFixed(4));
    t.clip.style.setProperty('--ty', end.ty.toFixed(4));
    t.clip.style.setProperty('--k', end.k.toFixed(4));
    t.clip.getAnimations().forEach((a) => a.cancel());
    const keys = [];
    for (let i = 0; i <= FRAMES; i++) {
      const e = EASE(i / FRAMES);
      const q = clipOf(
        from.c + (to.c - from.c) * e,
        from.r + (to.r - from.r) * e,
        from.s + (to.s - from.s) * e,
      );
      keys.push({
        offset: i / FRAMES,
        transform: `translate(${(q.tx * cell).toFixed(2)}px, ${(q.ty * cell).toFixed(2)}px) scale(${q.k.toFixed(4)})`,
      });
    }
    t.clip.animate(keys, { duration: 900, delay, easing: 'linear', fill: 'backwards' });
  };

  let index = -1;
  const next = () => {
    index = (index + 1) % states.length;
    show(index);
  };

  let frame = 0;
  window.addEventListener('resize', () => {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(size);
  });
  size();
  void root.offsetWidth;
  next();

  let timer = 0;
  let inView = false;
  const syncTimer = () => {
    clearInterval(timer);
    timer = !document.hidden && inView ? setInterval(next, HOLD) : 0;
  };
  document.addEventListener('visibilitychange', syncTimer);
  new IntersectionObserver((entries) => {
    inView = entries[0].isIntersecting;
    syncTimer();
  }).observe(root);
})();
</script>
